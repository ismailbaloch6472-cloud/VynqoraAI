
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vynqora AI — AI Video Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #292940}
.logo{font-size:27px;font-weight:bold;color:#bd91ff}
main{max-width:760px;margin:55px auto;padding:20px}
h1{text-align:center;font-size:40px}
h1 span{color:#b58aff}
.sub{text-align:center;color:#aaa;margin-bottom:35px}
.panel{background:#151522;padding:25px;border:1px solid #34344c;border-radius:18px}
label{display:block;margin:18px 0 9px;font-size:14px;font-weight:bold}
textarea,select{width:100%;padding:13px;background:#0b0b15;color:white;border:1px solid #3a3a52;border-radius:9px;font-size:15px}
textarea{height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{width:100%;padding:16px;margin-top:24px;border:0;border-radius:10px;background:linear-gradient(90deg,#9655ef,#536dff);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#status{text-align:center;color:#c5a8ff;line-height:1.6;margin-top:18px;overflow-wrap:anywhere}
video{display:block;width:100%;margin-top:20px;border-radius:12px;background:#000}
small{color:#999;line-height:1.6}
@media(max-width:500px){.grid{grid-template-columns:1fr}h1{font-size:32px}main{margin:25px auto}}
</style>
</head>
<body>
<header><div class="logo">✦ Vynqora AI</div></header>

<main>
<h1>Imagine It. <span>Generate It.</span></h1>
<p class="sub">Your imagination. Your video.</p>

<div class="panel">
<label for="prompt">Describe your video</label>
<textarea id="prompt" placeholder="A luxury car driving through a futuristic city at night..."></textarea>

<div class="grid">
<div>
<label for="duration">Video duration</label>
<select id="duration">
<option value="1">5 seconds</option>
<option value="2">10 seconds</option>
<option value="6" selected>30 seconds (6 clips)</option>
</select>
</div>

<div>
<label for="ratio">Video format</label>
<select id="ratio">
<option value="portrait">9:16 — Shorts / Reels</option>
<option value="landscape">16:9 — YouTube</option>
<option value="square">1:1 — Square</option>
</select>
</div>

<div>
<label for="voice">Voice-over</label>
<select id="voice">
<option value="yes">Include voice-over</option>
<option value="no">No voice-over</option>
</select>
</div>

<div>
<label for="music">Background music</label>
<select id="music">
<option value="yes">Include music</option>
<option value="no">No music</option>
</select>
</div>
</div>

<button id="generateBtn" onclick="generate()">✦ Generate Video</button>
<div id="status" role="status"></div>
<div id="videoResult"></div>
<p><small>30-second mode creates six short clips and joins them in your browser. Keep this tab open; generation may take several minutes. Voice-over and music are not connected yet.</small></p>
</div>
</main>

<script>
const API = "/api/video";
const HF = "https://numanajmal0-wan-video-api.hf.space";

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

function getVideoUrl(value) {
  if (!value) return null;

  if (typeof value === "string") {
    if (/^https?:\/\//i.test(value) &&
        /\.(mp4|webm|mov)(\?|$)/i.test(value)) return value;
    return null;
  }

  if (Array.isArray(value)) {
    for (const item of value) {
      const found = getVideoUrl(item);
      if (found) return found;
    }
    return null;
  }

  if (typeof value === "object") {
    if (typeof value.url === "string") {
      if (/^https?:\/\//i.test(value.url)) return value.url;
      if (value.url.startsWith("/")) return HF + value.url;
    }

    if (typeof value.path === "string" &&
        /\.(mp4|webm|mov)(\?|$)/i.test(value.path)) {
      if (/^https?:\/\//i.test(value.path)) return value.path;
      return HF + "/file=" + value.path.replace(/^\/+/, "");
    }

    for (const item of Object.values(value)) {
      const found = getVideoUrl(item);
      if (found) return found;
    }
  }

  return null;
}

async function readResponse(response) {
  const text = await response.text();

  if (!response.ok) {
    throw new Error("API request failed (" + response.status + "). Please try again later.");
  }

  return text;
}

async function generate() {
  const prompt = document.getElementById("prompt").value.trim();
  const status = document.getElementById("status");
  const resultBox = document.getElementById("videoResult");
  const button = document.getElementById("generateBtn");
  if (!prompt) { status.textContent = "Please describe your video first."; return; }
  button.disabled = true; resultBox.replaceChildren();
  try {
    const ratio = document.getElementById("ratio").value;
    let width = 480, height = 832;
    if (ratio === "landscape") { width = 832; height = 480; }
    else if (ratio === "square") { width = 640; height = 640; }
    const clipCount = Number(document.getElementById("duration").value);
    const clipUrls = [];
    for (let clip = 0; clip < clipCount; clip++) {
      status.textContent = "Generating clip " + (clip + 1) + " of " + clipCount + "...";
      const shotPrompt = prompt + "\nCinematic shot " + (clip + 1) + " of " + clipCount + ". Keep the same subject and visual style, with a slightly different camera angle or continuous action. No text.";
      const startResponse = await fetch(API, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:shotPrompt,width,height,num_frames:81,steps:20,guidance_scale:5,seed:-1,negative_prompt:"blurry, low quality, distorted, watermark, text"})});
      const raw = await readResponse(startResponse);
      let startData;
      try { startData = JSON.parse(raw); } catch { throw new Error("Unexpected AI response."); }
      if (!startData.event_id) throw new Error(startData.error || "AI did not return a generation ID.");
      let clipUrl = null;
      for (let i = 0; i < 60; i++) {
        await wait(5000);
        const check = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_id:startData.event_id})});
        const stream = await readResponse(check);
        if (stream.includes("event: error")) throw new Error("AI failed on clip " + (clip + 1) + ".");
        const events = stream.split(/\n\n+/);
        for (const event of events) {
          const dataLine = event.split("\n").find(line => line.startsWith("data:"));
          if (!dataLine) continue;
          try { clipUrl = getVideoUrl(JSON.parse(dataLine.slice(5).trim())); } catch {}
          if (clipUrl) break;
        }
        if (clipUrl) break;
        status.textContent = "Clip " + (clip + 1) + "/" + clipCount + " rendering (" + (i + 1) + "/60)...";
      }
      if (!clipUrl) throw new Error("Clip " + (clip + 1) + " timed out. Please try again.");
      clipUrls.push(clipUrl);
    }
    status.textContent = "Loading video joiner...";
    const { FFmpeg } = await import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js");
    const { toBlobURL } = await import("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js");
    const ffmpeg = new FFmpeg();
    const core = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
    await ffmpeg.load({coreURL:await toBlobURL(core+"/ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(core+"/ffmpeg-core.wasm","application/wasm")});
    const entries = [];
    for (let i = 0; i < clipUrls.length; i++) {
      status.textContent = "Preparing clip " + (i + 1) + "/" + clipUrls.length + " to join...";
      const res = await fetch(API, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({download_url:clipUrls[i]})
      });
      if (!res.ok) throw new Error("Could not download clip " + (i + 1) + " for joining (" + res.status + ").");
      await ffmpeg.writeFile("clip"+i+".mp4",new Uint8Array(await res.arrayBuffer()));
      entries.push("file 'clip"+i+".mp4'");
    }
    await ffmpeg.writeFile("clips.txt",new TextEncoder().encode(entries.join("\n")));
    await ffmpeg.exec(["-f","concat","-safe","0","-i","clips.txt","-c","copy","vynqora-final.mp4"]);
    const output = await ffmpeg.readFile("vynqora-final.mp4");
    const finalUrl = URL.createObjectURL(new Blob([output.buffer],{type:"video/mp4"}));
    const video = document.createElement("video"); video.controls=true; video.playsInline=true; video.src=finalUrl;
    const link = document.createElement("a"); link.href=finalUrl; link.download="vynqora-video.mp4"; link.textContent="Download your video"; link.style.cssText="display:block;margin-top:14px;color:#c5a8ff";
    resultBox.replaceChildren(video,link); status.textContent="Video ready! All clips have been joined.";
  } catch (error) { status.textContent = "Error: " + (error.message || "Something went wrong."); }
  finally { button.disabled = false; }
}
</script>
</body>
</html>
