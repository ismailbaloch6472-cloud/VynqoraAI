
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vynqora AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #292940}
.logo{font-size:27px;font-weight:bold;color:#bd91ff}
main{max-width:760px;margin:55px auto;padding:20px}
h1{text-align:center;font-size:40px}
h1 span{color:#b58aff}
.sub{text-align:center;color:#aaa;margin-bottom:35px}
.panel{background:#151522;padding:25px;border:1px solid #34344c;border-radius:18px}
label{display:block;margin:18px 0 9px;font-size:14px;font-weight:bold}
textarea,select{width:100%;padding:13px;background:#0b0b15;color:white;border:1px solid #3a3a52;border-radius:9px;font-size:15px}
textarea{height:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{width:100%;padding:16px;margin-top:24px;border:0;border-radius:10px;background:linear-gradient(90deg,#9655ef,#536dff);color:white;font-size:16px;font-weight:bold;cursor:pointer}
#status{text-align:center;color:#c5a8ff;line-height:1.6;margin-top:18px}
small{color:#999;line-height:1.6}
@media(max-width:500px){.grid{grid-template-columns:1fr}h1{font-size:32px}}
</style>
</head>
<body>
<header><div class="logo">✦ Vynqora AI</div></header>
<main>
<h1>Imagine It. <span>Generate It.</span></h1>
<p class="sub">Your imagination. Your video.</p>
<div class="panel">
<label for="prompt">Describe your video</label>
<textarea id="prompt" placeholder="A luxury car driving through a futuristic city at night..."></textarea>
<div class="grid">
<div><label for="duration">Video duration</label>
<select id="duration">
<option value="1">1 minute</option>
<option value="2">2 minutes</option>
<option value="3">3 minutes</option>
</select></div>
<div><label for="ratio">Video format</label>
<select id="ratio">
<option>9:16 — Shorts / Reels</option>
<option>16:9 — YouTube</option>
<option>1:1 — Square</option>
</select></div>
<div><label for="voice">Voice-over</label>
<select id="voice"><option>Include voice-over</option><option>No voice-over</option></select></div>
<div><label for="music">Background music</label>
<select id="music"><option>Include music</option><option>No music</option></select></div>
</div>
<button onclick="generate()">✦ Generate Video</button>
<div id="status"></div>
<p><small>Video generation requires a connected AI service. This demo page does not generate videos yet.</small></p>
</div>
</main>
<script>
function generate(){
let p=document.getElementById("prompt").value.trim();
let d=document.getElementById("duration").value;
let s=document.getElementById("status");
if(!p){s.textContent="Please describe your video first.";return;}
s.textContent="Your "+d+"-minute video request is ready. AI video generation is not connected yet.";
}
</script>
</body>
</html>
